name: Release

# 发布 WPF、Tasks/API 硬件包，以及硬件平台实际支持的 Docker 镜像。
# CoreML 依赖 macOS Core ML；Docker 不支持 macOS 容器，因此只发布 macOS 包。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  validate:
    name: Validate solution
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build
        run: dotnet build VisualIdentity.sln --configuration Release
      - name: Test
        run: dotnet test Snet.Yolo.Test/Snet.Yolo.Test.csproj --configuration Release --no-build

  wpf:
    name: WPF (${{ matrix.rid }})
    needs: validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content Snet.Yolo.Tool/Snet.Yolo.Tool.csproj -Raw
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { $version = "1.0.0" }
          "VERSION=$version" >> $env:GITHUB_OUTPUT
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish Snet.Yolo.Tool/Snet.Yolo.Tool.csproj `
            --configuration Release `
            --runtime "${{ matrix.rid }}" `
            --self-contained false `
            -p:Version="${{ steps.version.outputs.VERSION }}" `
            --output "publish/${{ matrix.rid }}"
      - name: Create archive
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" `
            -DestinationPath "publish/Snet.Yolo.Tool-v${{ steps.version.outputs.VERSION }}-${{ matrix.rid }}.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snet.Yolo.Tool-${{ matrix.rid }}
          path: publish/Snet.Yolo.Tool-v*.zip
          if-no-files-found: error

  packages:
    name: ${{ matrix.product }}.${{ matrix.target.provider }} (${{ matrix.target.rid }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: [Snet.Yolo.Tasks, Snet.Yolo.Api]
        target:
          - { provider: Cpu, rid: linux-x64, archive: tar.gz }
          - { provider: Cpu, rid: linux-arm64, archive: tar.gz }
          - { provider: Cpu, rid: win-x64, archive: zip }
          - { provider: Cuda, rid: linux-x64, archive: tar.gz }
          - { provider: Cuda, rid: win-x64, archive: zip }
          - { provider: DirectML, rid: win-x64, archive: zip }
          - { provider: OpenVino, rid: win-x64, archive: zip }
          - { provider: CoreML, rid: osx-x64, archive: tar.gz }
          - { provider: CoreML, rid: osx-arm64, archive: tar.gz }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Resolve metadata
        id: metadata
        shell: bash
        run: |
          PROJECT="${{ matrix.product }}.${{ matrix.target.provider }}"
          VERSION=$(grep -oP '<Version>\K[^<]+' "$PROJECT/$PROJECT.csproj" | head -1)
          [ -z "$VERSION" ] && VERSION="1.0.0"
          echo "PROJECT=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish
        shell: bash
        run: |
          dotnet publish "${{ steps.metadata.outputs.PROJECT }}/${{ steps.metadata.outputs.PROJECT }}.csproj" \
            --configuration Release \
            --runtime "${{ matrix.target.rid }}" \
            --self-contained false \
            -p:Version="${{ steps.metadata.outputs.VERSION }}" \
            --output "publish/${{ matrix.target.rid }}"
      - name: Create archive
        shell: bash
        run: |
          NAME="${{ steps.metadata.outputs.PROJECT }}-v${{ steps.metadata.outputs.VERSION }}-${{ matrix.target.rid }}"
          cd "publish/${{ matrix.target.rid }}"
          if [[ "${{ matrix.target.archive }}" == "zip" ]]; then
            zip -qr "../$NAME.zip" .
          else
            tar -czf "../$NAME.tar.gz" .
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.PROJECT }}-${{ matrix.target.rid }}
          path: publish/${{ steps.metadata.outputs.PROJECT }}-v*.${{ matrix.target.archive }}
          if-no-files-found: error

  docker-linux:
    name: Docker Linux (${{ matrix.image }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: snet-yolo-tasks-cpu, dockerfile: docker/Tasks.Cpu.Dockerfile, version_project: Snet.Yolo.Tasks.Cpu, platforms: "linux/amd64,linux/arm64" }
          - { image: snet-yolo-tasks-cuda, dockerfile: docker/Tasks.Cuda.Dockerfile, version_project: Snet.Yolo.Tasks.Cuda, platforms: "linux/amd64" }
          - { image: snet-yolo-api-cpu, dockerfile: docker/Api.Cpu.Dockerfile, version_project: Snet.Yolo.Api.Cpu, platforms: "linux/amd64,linux/arm64" }
          - { image: snet-yolo-api-cuda, dockerfile: docker/Api.Cuda.Dockerfile, version_project: Snet.Yolo.Api.Cuda, platforms: "linux/amd64" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Resolve metadata
        id: metadata
        shell: bash
        run: |
          REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          VERSION=$(grep -oP '<Version>\K[^<]+' "${{ matrix.version_project }}/${{ matrix.version_project }}.csproj" | head -1)
          [ -z "$VERSION" ] && VERSION="1.0.0"
          echo "REPO=$REPO" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          tags: ghcr.io/${{ steps.metadata.outputs.REPO }}/${{ matrix.image }}:${{ steps.metadata.outputs.VERSION }}

  release:
    name: GitHub Release
    needs: [wpf, packages, docker-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' Snet.Yolo.Tool/Snet.Yolo.Tool.csproj | head -1)
          [ -z "$VERSION" ] && VERSION="1.0.0"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Recreate manual release tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.VERSION }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Snet.Yolo.*
          path: publish
          merge-multiple: true
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="v${{ steps.version.outputs.VERSION }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          git fetch --tags --force
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          TASKS_VERSION=$(grep -oP '<Version>\K[^<]+' Snet.Yolo.Tasks.Cpu/Snet.Yolo.Tasks.Cpu.csproj | head -1)
          API_VERSION=$(grep -oP '<Version>\K[^<]+' Snet.Yolo.Api.Cpu/Snet.Yolo.Api.Cpu.csproj | head -1)
          {
            echo "## 更新内容"
            echo
            if [[ -n "$PREVIOUS" ]]; then
              echo "自上一版本 [\`$PREVIOUS\`](${{ github.server_url }}/${{ github.repository }}/compare/$PREVIOUS...$TAG) 以来的提交："
              echo
              git log --no-merges --pretty=format:'- %s' "$PREVIOUS..HEAD"
            else
              git log --no-merges -30 --pretty=format:'- %s'
            fi
            echo
            echo
            echo "## 安装包"
            echo
            find publish -maxdepth 1 -type f -printf '%f\n' | sort | sed 's/^/- `/' | sed 's/$/`/'
            echo
            echo "## Docker 镜像"
            echo
            for IMAGE in snet-yolo-tasks-cpu snet-yolo-tasks-cuda; do
              echo "- \`ghcr.io/$REPO/$IMAGE:$TASKS_VERSION\`"
            done
            for IMAGE in snet-yolo-api-cpu snet-yolo-api-cuda; do
              echo "- \`ghcr.io/$REPO/$IMAGE:$API_VERSION\`"
            done
            echo
            echo "> CoreML 依赖 macOS 原生 Core ML。Docker 不支持 macOS 容器，请使用对应 macOS 安装包。"
          } > NOTES.md
          echo "path=NOTES.md" >> "$GITHUB_OUTPUT"
      - name: Create or update GitHub Release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="v${{ steps.version.outputs.VERSION }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" publish/* --clobber
            gh release edit "$TAG" --notes-file "${{ steps.notes.outputs.path }}"
          else
            gh release create "$TAG" publish/* \
              --title "$TAG" \
              --notes-file "${{ steps.notes.outputs.path }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
